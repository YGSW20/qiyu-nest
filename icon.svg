<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Nest shape — three converging arcs -->
  <g transform="translate(256 310)">
    <!-- Outer ring -->
    <ellipse cx="0" cy="0" rx="170" ry="50" fill="none" stroke="url(#brand)" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
    <!-- Middle ring -->
    <ellipse cx="0" cy="-15" rx="120" ry="38" fill="none" stroke="url(#brand)" stroke-width="22" stroke-linecap="round" opacity="0.7"/>
    <!-- Inner ring -->
    <ellipse cx="0" cy="-25" rx="70" ry="25" fill="none" stroke="url(#brand)" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Core node — the gathering point -->
  <circle cx="256" cy="260" r="24" fill="white" opacity="0.95"/>
  <circle cx="256" cy="260" r="12" fill="url(#accent)"/>

  <!-- Floating particles — community members -->
  <circle cx="140" cy="190" r="6" fill="white" opacity="0.35"/>
  <circle cx="370" cy="180" r="5" fill="white" opacity="0.3"/>
  <circle cx="200" cy="145" r="4" fill="white" opacity="0.25"/>
  <circle cx="310" cy="140" r="5" fill="white" opacity="0.3"/>
  <circle cx="256" cy="120" r="4" fill="url(#accent)" opacity="0.6"/>
</svg>
