<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栖语 管理后台</title>
    <style>
        :root {
            --primary: #5B6AF0;
            --primary-dark: #4A56D4;
            --bg: #F0F2F5;
            --card: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --radius: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ========== 登录页 ========== */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-card .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .login-card .subtitle { color: var(--text-muted); margin-bottom: 28px; font-size: 14px; }

        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: 0.2s;
        }
        .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,106,240,0.1); }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .login-card button:hover { background: var(--primary-dark); }

        .login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

        /* ========== 管理布局 ========== */
        .admin-layout { display: none; min-height: 100vh; }

        /* 侧边栏 */
        .admin-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 240px;
            background: #1C1E2E;
            color: #fff;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-logo .dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; } 50% { opacity:0.3; }
        }

        .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }
        .sidebar-nav a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .sidebar-nav a.active { color: #fff; background: rgba(91,106,240,0.2); border-left-color: var(--primary); }

        .sidebar-nav .nav-icon { font-size: 16px; width: 22px; text-align: center; }
        .sidebar-nav .badge {
            margin-left: auto;
            background: var(--danger);
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 10px;
            font-weight: 500;
        }

        .sidebar-user {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-user .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F59E0B, #EF4444);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 14px;
        }
        .sidebar-user .name { font-size: 14px; font-weight: 500; }
        .sidebar-user .role { font-size: 11px; color: rgba(255,255,255,0.5); }
        .sidebar-user .logout {
            margin-left: auto;
            background: none; border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer; font-size: 16px;
            transition: 0.2s;
        }
        .sidebar-user .logout:hover { color: var(--danger); }

        /* 主区域 */
        .admin-main {
            margin-left: 240px;
            padding: 24px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-header h1 { font-size: 22px; font-weight: 700; }
        .page-header .time { color: var(--text-muted); font-size: 13px; }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.2s;
        }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
        }
        .stat-info .stat-value { font-size: 24px; font-weight: 700; }
        .stat-info .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .stat-change { font-size: 12px; margin-top: 4px; }
        .stat-change.up { color: var(--success); }
        .stat-change.down { color: var(--danger); }

        /* 面板 */
        .panel {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-header h2 { font-size: 16px; font-weight: 600; }
        .panel-body { padding: 20px; }

        /* 按钮组 */
        .btn {
            padding: 7px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background: #FEE2E2; color: var(--danger); }
        .btn-danger:hover { background: #FECACA; }
        .btn-success { background: #D1FAE5; color: #059669; }
        .btn-success:hover { background: #A7F3D0; }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 4px; }
        .btn-xs { padding: 2px 8px; font-size: 11px; border-radius: 3px; }

        /* 表格 */
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            background: var(--bg);
        }
        td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover td { background: #FAFBFF; }

        .status-dot {
            display: inline-block;
            width: 7px; height: 7px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.active { background: var(--success); }
        .status-dot.pending { background: var(--warning); }

        /* 标签 */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .tag-blue { background: #EEF0FF; color: var(--primary); }
        .tag-green { background: #D1FAE5; color: #059669; }
        .tag-red { background: #FEE2E2; color: var(--danger); }
        .tag-yellow { background: #FEF3C7; color: #D97706; }

        /* 搜索/筛选 */
        .toolbar {
            display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
        }
        .toolbar input, .toolbar select {
            padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 13px; outline: none; transition: 0.2s;
        }
        .toolbar input:focus, .toolbar select:focus { border-color: var(--primary); }

        /* 图表占位 */
        .chart-placeholder {
            background: var(--bg);
            border-radius: 8px;
            height: 200px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .bar-chart {
            display: flex; align-items: flex-end; gap: 20px; height: 160px;
            padding: 0 10px;
        }
        .bar-item {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            flex: 1;
        }
        .bar {
            width: 100%; max-width: 48px;
            border-radius: 6px 6px 0 0;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }
        .bar:hover { filter: brightness(1.1); }
        .bar-label { font-size: 11px; color: var(--text-muted); }
        .bar-value { font-size: 12px; font-weight: 600; }

        /* 操作确认弹窗 */
        .confirm-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: none; align-items: center; justify-content: center;
            z-index: 200; backdrop-filter: blur(4px);
        }
        .confirm-overlay.show { display: flex; }
        .confirm-box {
            background: #fff; border-radius: 12px; padding: 28px;
            width: 380px; max-width: 90vw; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .confirm-box h3 { margin-bottom: 12px; font-size: 17px; }
        .confirm-box p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
        .confirm-actions { display: flex; gap: 8px; justify-content: center; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #1A1A2E; color: #fff; padding: 10px 24px;
            border-radius: 20px; font-size: 14px; z-index: 300;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* 响应式 */
        @media (max-width: 768px) {
            .admin-sidebar { width: 60px; overflow: hidden; }
            .admin-sidebar .sidebar-logo span:last-child,
            .admin-sidebar .sidebar-nav a span:not(.nav-icon):not(.badge),
            .admin-sidebar .sidebar-user .name,
            .admin-sidebar .sidebar-user .role { display: none; }
            .admin-sidebar .sidebar-nav a { justify-content: center; padding: 12px; }
            .admin-main { margin-left: 60px; padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ===== AI Moderation ===== */
        .ai-moderate-btn {
            background: linear-gradient(135deg, #5B6AF0, #8B5CF6); color: #fff;
            padding: 8px 16px; border-radius: 6px; border: none;
            cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .ai-moderate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .ai-moderate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .ai-moderate-btn .spinner {
            display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        .ai-moderate-btn.loading .spinner { display: inline-block; }
        .ai-moderate-btn.loading .btn-text { display: none; }

        .score-tag {
            display: inline-block; padding: 1px 6px; border-radius: 3px;
            font-size: 10px; font-weight: 600; margin-left: 4px;
        }
        .score-tag.safe { background: #D1FAE5; color: #059669; }
        .score-tag.spam { background: #FEE2E2; color: #DC2626; }
        .score-tag.harassment { background: #FEF3C7; color: #D97706; }

        .ai-insight-card {
            background: linear-gradient(135deg, #EEF0FF, #F5F3FF);
            border: 1px solid rgba(91,106,240,0.15);
            border-radius: 10px; padding: 16px 20px; margin-bottom: 16px;
        }
        .ai-insight-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .ai-insight-card p { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
    </style>
</head>

        function saveAll() {
            setStore('closd_admin_posts', posts);

            setStore('closd_admin_forums', forums);
            setStore('closd_admin_comments', comments);

        // ==================== 登录逻辑 (JWT + role check) ====================
        async function doLogin() {
            var u = document.getElementById('loginUser').value.trim();
            var p = document.getElementById('loginPass').value.trim();
            var errEl = document.getElementById('loginError');
            try {
                var resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p }),
                });
                var data = await resp.json();
                if (!resp.ok) throw new Error(data.error || '登录失败');
                if (data.user.role !== 'admin') throw new Error('仅管理员可访问后台');
                localStorage.setItem('closd_token', data.token);
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminLayout').style.display = 'block';
                switchPage('dashboard', document.querySelector('.sidebar-nav a'));
                updateTime();
                setInterval(updateTime, 30000);
                updateBadges();
            } catch (e) {
                errEl.textContent = e.message;
                errEl.style.display = 'block';
            }
        }

        function doLogout() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminLayout').style.display = 'none';
            document.getElementById('loginPass').value = '';
        }

        document.getElementById('loginPass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent =
                now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN');
        }

        let currentPage = 'dashboard';

        // ==================== 页面切换 ====================
        function switchPage(page, el) {
            currentPage = page;
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            if (el) el.classList.add('active');

            const titles = {
                dashboard: '📊 仪表盘', posts: '📝 帖子管理', users: '👥 用户管理',
                comments: '💬 评论审核', forums: '📂 吧管理', settings: '⚙️ 系统设置',
            };
            document.getElementById('pageTitle').textContent = titles[page] || page;

            const content = document.getElementById('pageContent');
            switch (page) {
                case 'dashboard': content.innerHTML = renderDashboard(); break;
                case 'posts': content.innerHTML = renderPosts(); break;
                case 'users': content.innerHTML = renderUsers(); break;
                case 'comments': content.innerHTML = renderComments(); break;
                case 'reports': content.innerHTML = renderReports(); break;
                case 'analytics': content.innerHTML = renderAnalytics(); break;
                case 'forums': content.innerHTML = renderForums(); break;
                case 'settings': content.innerHTML = renderSettings(); break;
            }

            // 绑定事件
            if (page === 'posts') bindPostEvents();
            if (page === 'users') bindUserEvents();
            if (page === 'comments') bindCommentEvents();
            if (page === 'reports') bindReportEvents();
            if (page === 'analytics') bindAnalyticsEvents();
            if (page === 'forums') bindForumEvents();
            if (page === 'dashboard') bindDashboardEvents();
            if (page === 'settings') bindSettingsEvents();

            updateBadges();
        }

        function updateBadges() {
            document.getElementById('postCountBadge').textContent = posts.length;
            const pending = comments.filter(c => c.status === 'pending').length;
            document.getElementById('commentPendingBadge').textContent = pending;
            if (pending === 0) document.getElementById('commentPendingBadge').style.display = 'none';
            else document.getElementById('commentPendingBadge').style.display = 'inline';
        }

        // ==================== 仪表盘 ====================
        function renderDashboard() {
            const totalPosts = posts.length;
            const totalUsers = users.length;
            const totalForums = forums.length;
            const totalViews = posts.reduce((s,p) => s + p.views, 0);
            const pendingComments = comments.filter(c => c.status === 'pending').length;
            const todayPosts = posts.filter(p => p.time === '2026-07-03').length;

            // 帖子按吧分布
            const forumDist = {};
            posts.forEach(p => { forumDist[p.forum] = (forumDist[p.forum] || 0) + 1; });

            // 最近帖子
            const recentPosts = [...posts].sort((a,b) => b.id - a.id).slice(0, 5);

            return `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#EEF0FF;">📝</div>
                        <div class="stat-info">
                            <div class="stat-value">${totalPosts}</div>
                            <div class="stat-label">总帖子数</div>
                            <div class="stat-change up">↑ ${todayPosts} 今日新增</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#D1FAE5;">👥</div>
                        <div class="stat-info">
                            <div class="stat-value">${totalUsers}</div>
                            <div class="stat-label">注册用户</div>
                            <div class="stat-change up">↑ 3 今日新增</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#FEF3C7;">👁</div>
                        <div class="stat-info">
                            <div class="stat-value">${(totalViews/1000).toFixed(1)}k</div>
                            <div class="stat-label">总浏览量</div>
                            <div class="stat-change up">↑ 12.5% 较昨日</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#FEE2E2;">⚠️</div>
                        <div class="stat-info">
                            <div class="stat-value">${pendingComments}</div>
                            <div class="stat-label">待审核评论</div>
                            <div class="stat-change ${pendingComments > 0 ? 'down' : 'up'}">需处理</div>
                        </div>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
                    <div class="panel">
                        <div class="panel-header"><h2>📊 帖子按吧分布</h2></div>
                        <div class="panel-body">
                            <div class="bar-chart">
                                ${Object.entries(forumDist).map(([f, count]) => {
                                    const forum = forums.find(ff => ff.id === f);
                                    const name = forum ? forum.name : f;
                                    const icon = forum ? forum.icon : '';
                                    const pct = Math.round(count / totalPosts * 100);
                                    return `
                                        <div class="bar-item">
                                            <div class="bar-value">${count}</div>
                                            <div class="bar" style="height:${Math.max(count*12, 20)}px; background: linear-gradient(180deg, #5B6AF0, #8B5CF6);" title="${name}: ${count}"></div>
                                            <div class="bar-label">${icon} ${name}</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header"><h2>🕐 最新帖子</h2></div>
                        <div class="panel-body" style="padding:0;">
                            <table>
                                ${recentPosts.map(p => `
                                    <tr>
                                        <td style="font-size:13px;">${p.title.substring(0,18)}${p.title.length>18?'...':''}</td>
                                        <td style="font-size:12px;color:var(--text-muted);">${p.author}</td>
                                        <td><span class="tag tag-blue">${forums.find(f=>f.id===p.forum)?.name||p.forum}</span></td>
                                    </tr>
                                `).join('')}
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== 帖子管理 ====================
        function renderPosts(filter = '') {
            let filtered = posts;
            if (filter) {
                filtered = posts.filter(p =>
                    p.title.includes(filter) || p.author.includes(filter) ||
                    (forums.find(f=>f.id===p.forum)?.name||'').includes(filter)
                );
            }
            return `
                <div class="toolbar">
                    <input type="text" id="postSearch" placeholder="搜索帖子标题、作者..." oninput="filterPosts()">
                    <select id="postForumFilter" onchange="filterPosts()">
                        <option value="">全部吧</option>
                        ${forums.map(f => `<option value="${f.id}">${f.icon} ${f.name}</option>`).join('')}
                    </select>
                    <button class="btn btn-outline btn-sm" onclick="resetPostFilter()">🔄 重置</button>
                    <button class="btn btn-primary btn-sm" onclick="addPost()">+ 新建帖子</button>
                </div>
                <div class="panel" style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:40px;">ID</th>
                                <th>标题</th>
                                <th>作者</th>
                                <th>吧</th>
                                <th>状态</th>
                                <th>浏览</th>
                                <th>赞</th>
                                <th>回复</th>
                                <th style="width:180px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="postTableBody">
                            ${filtered.map(p => `
                                <tr>
                                    <td>${p.id}</td>
                                    <td>
                                        ${p.pinned ? '<span class="tag tag-yellow">📌 置顶</span> ' : ''}
                                        ${p.title.substring(0, 30)}${p.title.length>30?'...':''}
                                    </td>
                                    <td>${p.author}</td>
                                    <td><span class="tag tag-blue">${forums.find(f=>f.id===p.forum)?.name||p.forum}</span></td>
                                    <td><span class="tag ${p.status==='published'?'tag-green':'tag-yellow'}">${p.status==='published'?'已发布':'草稿'}</span></td>
                                    <td>${(p.views/1000).toFixed(1)}k</td>
                                    <td>${p.likes}</td>
                                    <td>${p.replies}</td>
                                    <td>
                                        <button class="btn btn-success btn-xs" onclick="togglePin(${p.id})">${p.pinned?'📌取消':'📌置顶'}</button>
                                        <button class="btn btn-outline btn-xs" onclick="editPost(${p.id})">✏️</button>
                                        <button class="btn btn-danger btn-xs" onclick="confirmDeletePost(${p.id})">🗑</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${filtered.length === 0 ? '<div style="text-align:center;padding:40px;color:var(--text-muted);">没有找到匹配的帖子</div>' : ''}
                </div>
            `;
        }

        function bindPostEvents() {
            document.getElementById('postSearch')?.addEventListener('input', filterPosts);
        }
        function filterPosts() {
            const search = document.getElementById('postSearch')?.value || '';
            const forum = document.getElementById('postForumFilter')?.value || '';
            let filtered = posts;
            if (search) filtered = filtered.filter(p => p.title.includes(search) || p.author.includes(search));
            if (forum) filtered = filtered.filter(p => p.forum === forum);
            document.getElementById('pageContent').innerHTML = renderPosts();
            document.getElementById('postSearch').value = search;
            document.getElementById('postForumFilter').value = forum;
            bindPostEvents();
        }
        function resetPostFilter() {
            document.getElementById('postSearch').value = '';
            document.getElementById('postForumFilter').value = '';
            document.getElementById('pageContent').innerHTML = renderPosts();
            bindPostEvents();
        }

        function togglePin(id) {
            const post = posts.find(p => p.id === id);
            if (post) { post.pinned = !post.pinned; saveAll(); switchPage('posts', document.querySelector('.sidebar-nav a:nth-child(2)')); showToast(post.pinned ? '已置顶' : '已取消置顶'); }
        }
        function editPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;
            const title = prompt('编辑标题：', post.title);
            if (title) { post.title = title; saveAll(); switchPage('posts', document.querySelector('.sidebar-nav a:nth-child(2)')); showToast('帖子已更新'); }
        }
        function addPost() {
            const title = prompt('新帖子标题：');
            if (!title) return;
            const forum = prompt('选择吧（tech/game/life/design/music/ai）：', 'tech');
            const newId = Math.max(...posts.map(p=>p.id), 0) + 1;
            posts.unshift({
                id: newId, title, author:'管理员', forum: forum || 'tech',
                time: new Date().toISOString().split('T')[0], status:'published',
                pinned:false, views:0, likes:0, replies:0,
            });
            saveAll(); switchPage('posts', document.querySelector('.sidebar-nav a:nth-child(2)')); showToast('新帖子已创建');
        }

        let deletePostId = null;
        function confirmDeletePost(id) {
            deletePostId = id;
            document.getElementById('confirmTitle').textContent = '删除帖子';
            document.getElementById('confirmMsg').textContent = '确定删除此帖子吗？此操作不可撤销。';
            document.getElementById('confirmOverlay').classList.add('show');
        }

        // ==================== 用户管理 ====================
        function renderUsers(filter = '') {
            let filtered = users;
            if (filter) filtered = users.filter(u => u.username.includes(filter) || u.role.includes(filter));
            return `
                <div class="toolbar">
                    <input type="text" id="userSearch" placeholder="搜索用户名..." oninput="filterUsers()">
                    <select id="userRoleFilter" onchange="filterUsers()">
                        <option value="">全部角色</option>
                        <option value="admin">管理员</option>
                        <option value="moderator">版主</option>
                        <option value="user">普通用户</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="addUser()">+ 添加用户</button>
                </div>
                <div class="panel" style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>用户名</th><th>角色</th><th>帖子数</th><th>注册日期</th><th>状态</th><th style="width:150px;">操作</th></tr>
                        </thead>
                        <tbody>
                            ${filtered.map(u => `
                                <tr>
                                    <td>${u.id}</td>
                                    <td>${u.username}</td>
                                    <td><span class="tag ${u.role==='admin'?'tag-red':u.role==='moderator'?'tag-blue':'tag-green'}">${u.role}</span></td>
                                    <td>${u.posts}</td>
                                    <td>${u.joinDate}</td>
                                    <td><span class="status-dot ${u.status}"></span>${u.status==='active'?'正常':'禁用'}</td>
                                    <td>
                                        <button class="btn btn-outline btn-xs" onclick="editUser(${u.id})">✏️</button>
                                        <button class="btn ${u.status==='active'?'btn-danger':'btn-success'} btn-xs" onclick="toggleUser(${u.id})">${u.status==='active'?'🚫禁用':'✅启用'}</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        function bindUserEvents() {
            document.getElementById('userSearch')?.addEventListener('input', filterUsers);
        }
        function filterUsers() {
            const search = document.getElementById('userSearch')?.value || '';
            const role = document.getElementById('userRoleFilter')?.value || '';
            let filtered = users;
            if (search) filtered = filtered.filter(u => u.username.includes(search));
            if (role) filtered = filtered.filter(u => u.role === role);
            document.getElementById('pageContent').innerHTML = renderUsers();
            document.getElementById('userSearch').value = search;
            document.getElementById('userRoleFilter').value = role;
            bindUserEvents();
        }
        function toggleUser(id) {
            const user = users.find(u => u.id === id);
            if (user) { user.status = user.status === 'active' ? 'banned' : 'active'; saveAll(); switchPage('users', document.querySelector('.sidebar-nav a:nth-child(3)')); showToast(user.status === 'active' ? '用户已启用' : '用户已禁用'); }
        }
        function editUser(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            const name = prompt('用户名：', user.username);
            if (name) { user.username = name; saveAll(); switchPage('users', document.querySelector('.sidebar-nav a:nth-child(3)')); showToast('用户已更新'); }
        }
        function addUser() {
            const name = prompt('新用户名：');
            if (!name) return;
            const newId = Math.max(...users.map(u=>u.id), 0) + 1;
            users.push({ id:newId, username:name, role:'user', posts:0, joinDate:new Date().toISOString().split('T')[0], status:'active' });
            saveAll(); switchPage('users', document.querySelector('.sidebar-nav a:nth-child(3)')); showToast('用户已添加');
        }

        // ==================== 评论审核 ====================
        function renderComments() {
            const pendingCount = comments.filter(c => c.status === 'pending').length;
            return `
                <div class="toolbar">
                    <select id="commentStatusFilter" onchange="filterComments()">
                        <option value="">全部状态</option>
                        <option value="approved">✅ 已通过</option>
                        <option value="pending" selected>⏳ 待审核</option>
                        <option value="rejected">❌ 已拒绝</option>
                    </select>
                    <button class="ai-moderate-btn" id="aiModerateBtn" onclick="aiModerateComments()" ${pendingCount === 0 ? 'disabled' : ''}>
                        <span class="spinner"></span><span class="btn-text">✨ AI 自动审核 (${pendingCount}条待审)</span>
                    </button>
                </div>
                <div class="panel">
                    <table>

                            <tr><th>ID</th><th>所属帖子</th><th>作者</th><th>内容</th><th>时间</th><th>状态</th><th style="width:200px;">操作</th></tr>

                        <tbody>
                            ${comments.map(c => {
                                const post = posts.find(p => p.id === c.postId);
                                return `
                                    <tr style="${c.status==='pending'?'background:#FFFBEB;':''}">
                                        <td>${c.id}</td>
                                        <td style="font-size:12px;">${post ? post.title.substring(0,15)+'...' : '未知'}</td>
                                        <td>${c.author}</td>

                                        <td>${c.time}</td>
                                        <td><span class="tag ${c.status==='approved'?'tag-green':c.status==='pending'?'tag-yellow':'tag-red'}">${c.status==='approved'?'通过':c.status==='pending'?'待审':'拒绝'}</span></td>
                                        <td>
                                            ${c.status === 'pending' ? `
                                                <button class="btn btn-success btn-xs" onclick="approveComment(${c.id})">✅ 通过</button>
                                                <button class="btn btn-danger btn-xs" onclick="rejectComment(${c.id})">❌ 拒绝</button>
                                            ` : `
                                                <button class="btn btn-outline btn-xs" onclick="toggleCommentStatus(${c.id})">🔄 改状态</button>

                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        function bindCommentEvents() {
            const sel = document.getElementById('commentStatusFilter');
            if (sel) sel.value = 'pending';
        }
        function filterComments() {
            const status = document.getElementById('commentStatusFilter')?.value || '';
            let filtered = comments;
            if (status) filtered = comments.filter(c => c.status === status);
            // 重建显示
            const tbody = document.querySelector('#pageContent tbody');
            if (tbody) {
                tbody.innerHTML = filtered.map(c => {
                    const post = posts.find(p => p.id === c.postId);
                    return `<tr style="${c.status==='pending'?'background:#FFFBEB;':''}">
                        <td>${c.id}</td>
                        <td>${post ? post.title.substring(0,15)+'...' : '未知'}</td>
                        <td>${c.author}</td><td>${c.text}</td><td>${c.time}</td>
                        <td><span class="tag ${c.status==='approved'?'tag-green':c.status==='pending'?'tag-yellow':'tag-red'}">${c.status==='approved'?'通过':c.status==='pending'?'待审':'拒绝'}</span></td>
                        <td>
                            ${c.status==='pending'?`<button class="btn btn-success btn-xs" onclick="approveComment(${c.id})">✅ 通过</button><button class="btn btn-danger btn-xs" onclick="rejectComment(${c.id})">❌ 拒绝</button>`:`<button class="btn btn-outline btn-xs" onclick="toggleCommentStatus(${c.id})">🔄 改状态</button>`}
                            <button class="btn btn-danger btn-xs" onclick="confirmDeleteComment(${c.id})">🗑</button>
                        </td></tr>`;
                }).join('');
            }
        }
        function approveComment(id) {
            const c = comments.find(c => c.id === id);
            if (c) { c.status = 'approved'; saveAll(); switchPage('comments', document.querySelector('.sidebar-nav a:nth-child(4)')); showToast('评论已通过'); }
        }
        function rejectComment(id) {
            const c = comments.find(c => c.id === id);
            if (c) { c.status = 'rejected'; saveAll(); switchPage('comments', document.querySelector('.sidebar-nav a:nth-child(4)')); showToast('评论已拒绝'); }
        }
        function toggleCommentStatus(id) {
            const c = comments.find(c => c.id === id);
            if (c) {
                const states = ['approved', 'pending', 'rejected'];
                const idx = states.indexOf(c.status);
                c.status = states[(idx + 1) % 3];
                saveAll(); switchPage('comments', document.querySelector('.sidebar-nav a:nth-child(4)'));
                showToast('状态已更改: ' + c.status);
            }
        }
        let deleteCommentId = null;
        function confirmDeleteComment(id) {
            deleteCommentId = id;
            document.getElementById('confirmTitle').textContent = '删除评论';
            document.getElementById('confirmMsg').textContent = '确定删除此评论吗？';
            document.getElementById('confirmOverlay').classList.add('show');
        }

        // ==================== AI 审核 ====================
        const AI_API_BASE = window.location.origin + '/api/ai';

        async function aiModerateComments() {
            const pending = comments.filter(c => c.status === 'pending');
            if (pending.length === 0) { showToast('没有待审核的评论'); return; }

            const btn = document.getElementById('aiModerateBtn');
            btn.classList.add('loading');
            btn.querySelector('.btn-text').textContent = 'AI 审核中...';

            try {
                const items = pending.map(c => ({ id: c.id, text: c.text }));
                const resp = await fetch(AI_API_BASE + '/moderate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items }),
                    signal: AbortSignal.timeout(30000),
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || '审核失败');

                // Apply AI decisions
                let approvedCount = 0, rejectedCount = 0;
                (data.results || []).forEach(r => {
                    const comment = comments.find(c => c.id === r.id);
                    if (!comment) return;
                    if (r.verdict === 'safe') {
                        comment.status = 'approved';
                        comment.aiReason = r.reason;
                        approvedCount++;
                    } else {
                        comment.status = 'rejected';
                        comment.aiReason = r.reason;
                        rejectedCount++;
                    }
                });

                // For any pending comments AI didn't process, keep as pending
                saveAll();
                switchPage('comments', document.querySelector('.sidebar-nav a:nth-child(4)'));
                showToast(`AI 审核完成：✅ 通过 ${approvedCount} 条，❌ 拒绝 ${rejectedCount} 条`);
            } catch (err) {
                showToast('AI 审核失败: ' + err.message);
                btn.classList.remove('loading');
                btn.querySelector('.btn-text').textContent = '✨ AI 自动审核 (' + pending.length + '条待审)';
            }
        }

                const verdictTag = c.aiReason
                    ? `<span class="score-tag ${c.status === 'approved' ? 'safe' : (c.status === 'rejected' ? 'spam' : 'harassment')}" title="${c.aiReason}">${c.aiReason.substring(0, 8)}</span>`
                    : '<span style="font-size:10px;color:var(--text-muted);">-</span>';

                html += `

                        <td>

                                <button class="btn btn-danger btn-xs" onclick="rejectComment(${c.id})">❌ 拒绝</button>
                            ` : `
                                <button class="btn btn-outline btn-xs" onclick="toggleCommentStatus(${c.id})">🔄 改状态</button>
                            `}
                            <button class="btn btn-danger btn-xs" onclick="confirmDeleteComment(${c.id})">🗑</button>
                        </td>
                    </tr>`;
            });

            html += `</tbody></table>
                ${comments.length === 0 ? '<div style="text-align:center;padding:40px;color:var(--text-muted);">没有找到评论</div>' : ''}
                </div>`;
            return html;
        };

        // Override renderUsers to add role buttons
        var _origRenderUsers = renderUsers;
        renderUsers = function(filter){
          var html = _origRenderUsers(filter);
          setTimeout(function(){
            var tbody = document.querySelector('#pageContent tbody');
            if(!tbody) return;
            var rows = tbody.querySelectorAll('tr');
            rows.forEach(function(row){
              var nameCell = row.querySelector('td:nth-child(2)');
              if(!nameCell) return;
              var username = nameCell.textContent.trim();
              var actions = row.querySelector('td:last-child');
              if(!actions) return;
              if(!actions.querySelector('.role-btn')){
                var btnGroup = document.createElement('span');
                btnGroup.innerHTML = ' <button class="btn btn-outline btn-xs role-btn" onclick="setUserRole(\''+username+'\',\'moderator\')">版主</button> <button class="btn btn-outline btn-xs role-btn" onclick="setUserRole(\''+username+'\',\'user\')">用户</button>';
                actions.appendChild(btnGroup);
              }
            });
          },100);
          return html;
        };

        // ==================== 初始化 ====================
        updateBadges();
        document.getElementById('loginPass').focus();
    </script>
</body>
</html>
